services:
  postgres:
    image: postgres:16
    container_name: banking-refinery-postgres-ci
    environment:
      POSTGRES_DB: banking_refinery
      POSTGRES_USER: refinery_user
      POSTGRES_PASSWORD: refinery_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refinery_user -d banking_refinery"]
      interval: 5s
      timeout: 10s
      retries: 10