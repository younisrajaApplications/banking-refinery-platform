spring.application.name=java-ingestion-service
server.port=8080

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
refinery.output.base-directory=../../data/processed

spring.datasource.url=jdbc:postgresql://localhost:5432/banking_refinery
spring.datasource.username=refinery_user
spring.datasource.password=refinery_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

logging.level.org.flywaydb=DEBUG